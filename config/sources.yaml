# 수집 출처. primary는 매일 목록 페이지를 직접 열어봄, secondary는 검색으로 보강.

primary:
  - name: World Nuclear News
    url: https://www.world-nuclear-news.org/
  - name: NucNet
    url: https://www.nucnet.org/
  - name: ANS Nuclear Newswire
    url: https://www.ans.org/news/
  # IAEA는 목록 페이지가 막힐 때가 있어 실패하면 검색으로 대체 (unreachable 참고)
  - name: IAEA News
    url: https://www.iaea.org/news
  - name: OECD NEA News
    url: https://www.oecd-nea.org/jcms/c_12886/news

# RSS 피드 — 게재일이 정확하고 목록이 완전하다. 검색보다 이걸 먼저 본다(몇 달 전 기사를 최신으로 오인하는 문제를 없앰).
# 2026-09-22 접속 확인. curl 로 받아 제목·링크·pubDate 를 뽑는다.
feeds:
  - { name: World Nuclear News, url: "https://www.world-nuclear-news.org/RSS", note: "전 분야, 약 49건, pubDate 있음" }
  - { name: IAEA Top News, url: "https://www.iaea.org/feeds/topnews", note: "IAEA 공식" }
  - { name: Nuclear Engineering International, url: "https://www.neimagazine.com/feed", note: "전문지" }
  - { name: POWER Magazine, url: "https://www.powermag.com/feed/", note: "발전 전반, 원자력 포함" }
  - { name: UK DESNZ (gov.uk), url: "https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=department-for-energy-security-and-net-zero", note: "영국 에너지부 발표, Atom 형식" }

secondary:
  - Reuters (energy / nuclear)
  - Bloomberg (energy)
  - Financial Times
  - Nikkei Asia
  - POWER Magazine
  - Neutron Bytes
  - 각국 에너지부·원자력 규제기관 보도자료 (US DOE/NRC, UK DESNZ/ONR, Czech MPO, Poland PEJ, Saudi, UAE ENEC 등)
  - 벤더 보도자료 (Westinghouse, EDF, KHNP, Rosatom, Rolls-Royce SMR, NuScale, GE Vernova Hitachi)

# 현지어 매체 — 영어권 매체보다 먼저 나오는 입찰·정책·여론 신호를 잡기 위함.
