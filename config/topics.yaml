  - "nuclear teaming agreement letter of intent {date}"
  - "BWRX-300 agreement {date}"
  - "TerraPower OR X-energy OR Oklo agreement {date}"
  - "Last Energy OR Radiant OR Nano Nuclear microreactor deal {date}"
  - "AP1000 OR APR1400 OR CANDU contract award {date}"
  - "Hyundai E&C OR Daewoo OR Doosan nuclear contract {date}"
  - "nuclear EPC consortium formed {date}"
