# 해외영업팀 관심 분야 설정 — 코드 몰라도 이 파일만 고치면 에이전트 동작이 바뀝니다.

# 영역: 브리핑을 크게 둘로 나눔. 기사의 "주어"가 한국이면 국내, 아니면 해외.
regions:
  overseas: "해외 — 해외 정부·기업·기관이 주체 (각국 정책, 발주·입찰, 경쟁 벤더, 국제기구)"
  domestic: "국내 — 한국이 주체 (한전·한수원·국내 기업의 해외사업 포함, i-SMR, 정부·원안위 정책, 국내 건설·운영)"

# 분류: 두 영역 모두 같은 4개 분류를 씀
categories:
  large:  "대형원전 (APR1400/APR1000, AP1000, EPR, VVER, Hualong One 등 신규 건설·수주·계속운전·운영)"
  smr:    "SMR·마이크로·선진로 (i-SMR, NuScale, BWRX-300, Rolls-Royce SMR, Xe-100, Natrium 등)"
  policy: "정책·규제·정세·국제기구·기관 경영 (IAEA, NEA, EU, 정권 교체, 원안위, 전력수급계획, 한전·한수원 경영)"
  fuel:   "우라늄·농축·HALEU·핵연료·기자재 공급망"

# 국내에서 특히 챙길 주제 (국내 기사 선별 기준)
domestic_focus:
  - 한전·한수원 주도 해외사업 (체코 두코바니, 중동·동유럽·동남아 수주 활동, 해외 파트너십)
  - i-SMR 개발·인허가·해외 진출
  - 정부 원전 정책 (전력수급기본계획, 신규 원전, 수출 지원·금융)
  - 원안위 규제 (건설·운영 허가, 계속운전, 표준설계인가)
  - 국내 원전 건설·운영 실적 (해외 입찰의 레퍼런스가 되는 공기·가동률)
  - 국내 공급망 (두산에너빌리티 등 주기기·기자재 업체 수주)
  - 한전·한수원 기관장 인사·조직 개편·재무

