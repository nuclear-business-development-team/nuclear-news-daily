<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>원자력 해외동향</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eef1f3; --surface:#ffffff; --sunken:#f6f8f9; --ink:#132026; --ink-2:#34454d; --muted:#65757c; --line:#dce2e5; --line-2:#e9edef;
  --accent:#0a6f96; --accent-soft:#e3f0f6; --navy:#10262f;
  --large:#2c5a86; --smr:#0d8474; --policy:#946018; --fuel:#6a4c9c;
  --up:#1f7a4d; --steady:#65757c; --caution:#b0701a; --down:#b23b3b;
  --star:#c98a12;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1215; --surface:#131e23; --sunken:#0f181c; --ink:#e3ebee; --ink-2:#c3d0d5; --muted:#8fa0a7; --line:#24333a; --line-2:#1c292f;
    --accent:#4cc0e8; --accent-soft:#11303b; --navy:#0f1d23;
    --large:#80b1e2; --smr:#4fcfbb; --policy:#e2b272; --fuel:#baa3e8;
    --up:#5fd39a; --steady:#8fa0a7; --caution:#e8b25a; --down:#f07f7f; --star:#f0c24a;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1215; --surface:#131e23; --sunken:#0f181c; --ink:#e3ebee; --ink-2:#c3d0d5; --muted:#8fa0a7; --line:#24333a; --line-2:#1c292f;
  --accent:#4cc0e8; --accent-soft:#11303b; --navy:#0f1d23;
  --large:#80b1e2; --smr:#4fcfbb; --policy:#e2b272; --fuel:#baa3e8;
  --up:#5fd39a; --steady:#8fa0a7; --caution:#e8b25a; --down:#f07f7f; --star:#f0c24a;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);scroll-behavior:smooth;scroll-padding-top:72px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── top bar ─────────────────────────── */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#e8f1f4}
.bar-in{max-width:1200px;margin:0 auto;padding-inline:16px;height:56px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{flex:none}
.logo b{font-size:16px;font-weight:700;white-space:nowrap}
.logo small{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#7fc9e4;white-space:nowrap}
.datenav{margin-left:auto;display:flex;align-items:center;gap:4px}
.datenav button,.datenav select{height:34px;border-radius:7px;border:1px solid #2c4652;background:#16323d;color:#e8f1f4;padding:0 10px;cursor:pointer;font:500 13.5px var(--mono)}
.datenav button:disabled{opacity:.35;cursor:default}
.lang-switch{font:600 12.5px var(--sans)!important;padding:0 12px!important;margin-right:6px}
@media (max-width:560px){.logo small{display:none}}

/* ── layout ─────────────────────────── */
.page{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 90px);overflow:auto;padding-bottom:8px}
main{min-width:0;display:flex;flex-direction:column;gap:22px}
@media (max-width:959px){
  .page{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none;overflow:visible}
  .side .panel.toc,.side .panel.archive{display:none}
}

/* ── side panels ─────────────────────── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.panel h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.search{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--sunken);padding:0 10px;font-size:14px}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.catnav{display:flex;flex-direction:column;gap:2px}
.catnav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:6px 8px;cursor:pointer;font-size:14px}
.catnav button:hover{background:var(--sunken)}
.catnav button[aria-pressed="true"]{background:var(--accent-soft);font-weight:600}
.catnav .dot{width:9px;height:9px;border-radius:2px;background:var(--c,var(--muted));flex:none}
.catnav .n{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
@media (max-width:959px){
  .side .panel.filters{padding:10px}
  .catnav{flex-direction:row;flex-wrap:wrap;gap:6px;margin-top:10px}
  .catnav button{width:auto;border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:13px}
  .catnav .n{margin-left:2px}
}
.archive ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.archive button{width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:6px 8px;cursor:pointer}
.archive button:hover{background:var(--sunken)}
.archive button[aria-current="true"]{background:var(--accent-soft)}
.archive .d{display:block;font:500 12.5px var(--mono);color:var(--accent)}
.archive .h{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ── main blocks ─────────────────────── */
.headline h1{margin:0;font-size:26px;line-height:1.25;font-weight:700;text-wrap:balance}
.headline .sub{margin:4px 0 0;font:500 12.5px var(--mono);color:var(--muted)}
.dist{margin-top:14px;display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line-2)}
.dist span{display:block;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:6px;vertical-align:0}
.legend b{font:500 12px var(--mono);margin-left:4px}

.regions{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:-6px}
.regions button{position:relative;background:none;border:0;padding:10px 16px 12px;font-size:16px;font-weight:600;color:var(--muted);cursor:pointer}
.regions button .n{font:500 12px var(--mono);margin-left:6px;color:var(--muted)}
.regions button[aria-selected="true"]{color:var(--ink)}
.regions button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.it .rg{font-size:11.5px;font-weight:600;color:var(--bg);background:var(--ink-2);border-radius:4px;padding:0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.sec-h h2{margin:0;font-size:17px;font-weight:700}
.sec-h .n{font:500 12px var(--mono);color:var(--muted)}
.sec-h .hint{margin-left:auto;font-size:12px;color:var(--muted)}

.summary{padding:18px 20px}
.summary p{margin:0;max-width:72ch;color:var(--ink-2)}
.sales{margin-top:14px;display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:8px;padding:12px 14px}
.sales b{flex:none;font:600 11.5px var(--mono);letter-spacing:.06em;color:var(--accent);padding-top:3px}
.sales p{margin:0;color:var(--ink);font-weight:500}

.keylist{list-style:none;margin:0;padding:0}
.keylist li+li{border-top:1px solid var(--line-2)}
.keylist a{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 16px;text-decoration:none;color:inherit}
.keylist a:hover{background:var(--sunken)}
.keylist .tag{grid-row:span 2;align-self:start;margin-top:3px;font:600 11px var(--mono);color:var(--c);border:1px solid currentColor;border-radius:4px;padding:1px 6px;white-space:nowrap}
.keylist .t{font-weight:600;line-height:1.45}
.keylist .s{font-size:13.5px;color:var(--muted);line-height:1.5}

.tbl-wrap{overflow-x:auto}
table.pulse{width:100%;border-collapse:collapse;font-size:14px}
.pulse th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.pulse td{padding:10px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
.pulse tr:last-child td{border-bottom:0}
.pulse tbody tr{cursor:pointer}
.pulse tbody tr:hover td{background:var(--sunken)}
.pulse tbody tr[aria-selected="true"] td{background:var(--accent-soft)}
.pulse .cn{font-weight:600;white-space:nowrap}
.pulse .sg{color:var(--ink-2);min-width:220px}
.pulse .ct{font:500 12.5px var(--mono);color:var(--muted);text-align:right;white-space:nowrap}
.stance{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--sans);white-space:nowrap;color:var(--sc)}
.stance::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-expanding{--sc:var(--up)} .st-steady{--sc:var(--steady)} .st-cautious{--sc:var(--caution)} .st-retreating{--sc:var(--down)}
@media (max-width:640px){
  table.pulse,.pulse tbody,.pulse tr,.pulse td{display:block;width:100%}
  .pulse thead{display:none}
  .pulse tr{padding:10px 14px;border-bottom:1px solid var(--line-2)}
  .pulse td{padding:0;border:0}
  .pulse td.cn{display:inline;margin-right:8px}
  .pulse td.st{display:inline}
  .pulse td.ct{display:none}
  .pulse .sg{min-width:0;margin-top:3px;font-size:13.5px}
}

.filterbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:var(--accent-soft);border-radius:10px;font-size:14px}
.filterbar button{margin-left:auto;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:99px;padding:3px 12px;cursor:pointer;font-size:13px}

.catsec{scroll-margin-top:72px}
.catsec .sec-h h2::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:8px;vertical-align:1px}
.items{display:flex;flex-direction:column;gap:10px}
article.it{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;scroll-margin-top:72px}
article.it:target{box-shadow:0 0 0 2px var(--accent)}
.it .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;color:var(--muted)}
.it .stars{color:var(--star);letter-spacing:1px;font-size:12px}
.it .src{font:500 12px var(--mono)}
.it .lang{font-size:11.5px;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 5px}
.it .flags{display:flex;flex-wrap:wrap;gap:4px}
.it .flags span{font-size:11.5px;background:var(--sunken);border:1px solid var(--line-2);border-radius:4px;padding:0 6px;color:var(--ink-2)}
.it h3{margin:6px 0 0;font-size:16.5px;line-height:1.45;font-weight:700;text-wrap:balance}
.it h3 a{color:var(--ink);text-decoration:none}
.it h3 a:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.it .orig{margin:2px 0 0;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.it .sum{margin:10px 0 0;color:var(--ink-2);max-width:72ch}
.it .note{margin-top:10px;border-left:3px solid var(--accent);background:var(--sunken);padding:8px 12px;border-radius:0 6px 6px 0;font-size:14px}
.it .note b{display:block;font:600 11px var(--mono);letter-spacing:.06em;color:var(--accent);margin-bottom:2px}
.it .rel{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.cat-large{--c:var(--large)} .cat-smr{--c:var(--smr)} .cat-policy{--c:var(--policy)} .cat-fuel{--c:var(--fuel)}
.empty,.err{color:var(--muted);padding:28px 0;text-align:center}
footer{grid-column:1/-1;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:8px}
@media (min-width:960px){footer{grid-column:2;max-width:none}}
@media (max-width:560px){
  .headline h1{font-size:21px}
  .summary{padding:16px}
  article.it{padding:13px 14px}
  .it h3{font-size:16px}
}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="3" fill="#7fc9e4"/><g fill="none" stroke="#7fc9e4" stroke-width="1.4"><ellipse cx="13" cy="13" rx="11" ry="4.2"/><ellipse cx="13" cy="13" rx="11" ry="4.2" transform="rotate(60 13 13)"/><ellipse cx="13" cy="13" rx="11" ry="4.2" transform="rotate(120 13 13)"/></g></svg>
      <b id="brand">원자력 해외동향</b><small id="tagline">Overseas Nuclear Brief</small>
    </div>
    <div class="datenav">
      <button id="langbtn" class="lang-switch">English</button>
      <button id="prev" aria-label="prev">‹</button>
      <select id="date" aria-label="date"></select>
      <button id="next" aria-label="next">›</button>
    </div>
  </div>
</header>

<div class="page">
  <aside class="side">
    <div class="panel filters">
      <input id="q" class="search" type="search">
      <label class="chk"><input type="checkbox" id="imp"> <span id="impLabel"></span></label>
      <div class="catnav" id="catnav"></div>
    </div>
    <div class="panel toc"><h4 id="tocTitle"></h4><div class="catnav" id="toc"></div></div>
    <div class="panel archive"><h4 id="archiveTitle"></h4><ul id="archive"></ul></div>
  </aside>

  <main id="main"><p class="empty">…</p></main>

  <footer id="footnote"></footer>
</div>

    regionStats: (r,n,k,c) => `${n} ${r.toLowerCase()} stories · ${k} key${c !== null ? ` · ${c} countries` : ""}`,
    summary: r => `${r} summary`, salesAngle: "Sales angle", salesNote: "Sales angle",
    keyTitle: "Key stories", keyCount: n => `★★★ ${n}`, keyHint: "tap to jump",
    pulseTitle: "Country pulse", pulseCount: n => `${n} countries`, pulseHint: "tap a row to filter by country",
    thCountry: "Country", thStance: "Stance", thSignal: "Today's signal", thArticles: "Stories", nArticles: n => `${n}`,
    filterLabel: (s,n) => `Filter: <b>${s}</b> — ${n} stories`, clear: "Clear filter",
    none: "No stories match.", err: d => `Could not load the ${d} briefing.`,
    indexErr: "Could not load the briefing index. Open this page from its GitHub Pages URL.",
    origLang: l => `${l} original`, related: "Also reported", noDomestic: "No Korean stories in this briefing.",
    impTitle: n => `importance ${n}`, prev: "Previous day", next: "Next day", pickDate: "Pick a date",
    foot: "Collected and summarised every day at 08:00 KST by an AI agent from international, local-language and Korean sources. Summaries and sales angles are for orientation — always check the original article.",
    other: "한국어"
  }
};
let LANGCODE = "ko";
try { const p = new URLSearchParams(location.search).get("lang"); if (I18N[p]) LANGCODE = p; else if (/(^|\/)en\/?$/.test(location.pathname)) LANGCODE = "en"; } catch(e){}
try { if (!new URLSearchParams(location.search).has("lang")) { const s = localStorage.getItem("nnd-lang"); if (I18N[s]) LANGCODE = s; } } catch(e){}
let T = I18N[LANGCODE];
const CAT = new Proxy({}, {get:(_,k) => T.cat[k]});
const STANCE = new Proxy({}, {get:(_,k) => T.stance[k]});
const REG = new Proxy({}, {get:(_,k) => T.reg[k], ownKeys:() => ["overseas","domestic"], getOwnPropertyDescriptor:() => ({enumerable:true, configurable:true})});
const LANG = new Proxy({}, {get:(_,k) => T.lang[k]});
const CN = new Proxy({}, {get:(_,k) => T.cn[k]});
const WD = new Proxy([], {get:(_,k) => T.wd[k]});
const regionOf = a => a.region || "overseas";
const state = {days:[], heads:{}, date:null, data:null, region:"overseas", cat:null, country:null, imp:false, q:""};
try{ const r = localStorage.getItem("nnd-region"); if(REG[r]) state.region = r; }catch(e){}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cname = c => CN[c] || c;
// 영어판에 값이 없으면 한글로 되돌아간다 (영어 항목이 추가되기 전 브리핑도 열리도록)
const pick = (o, base) => (LANGCODE === "en" ? (o[base + "_en"] || o[base + "_ko"] || o[base]) : (o[base + "_ko"] || o[base])) || "";
const fmtDate = d => { const [y,m,dd] = d.split("-").map(Number); const w = new Date(Date.UTC(y,m-1,dd)).getUTCDay(); return T.date(y,m,dd,T.wd[w]); };

async function getJSON(p){ const r = await fetch(p, {cache:"no-cache"}); if(!r.ok) throw new Error(p+" "+r.status); return r.json(); }

function applyStatic(){
  document.documentElement.lang = T.html;
  document.title = T.title;
  $("#brand").textContent = T.title;
  $("#tagline").textContent = T.tagline;
  $("#langbtn").textContent = T.other;
  $("#q").placeholder = T.searchPh;
  $("#impLabel").textContent = T.impOnly;
  $("#tocTitle").textContent = T.toc;
  $("#archiveTitle").textContent = T.archive;
  $("#footnote").textContent = T.foot;
  $("#prev").setAttribute("aria-label", T.prev);
  $("#next").setAttribute("aria-label", T.next);
  $("#date").setAttribute("aria-label", T.pickDate);
}

function setLang(l){
  LANGCODE = l; T = I18N[l];
  try{ localStorage.setItem("nnd-lang", l); }catch(e){}
  try{ const u = new URL(location.href); u.searchParams.set("lang", l); history.replaceState(null, "", u); }catch(e){}
  applyStatic();
  if(state.data) render();
}

async function boot(){
  applyStatic();
  try{
    const idx = await getJSON("data/index.json");
    idx.days.forEach(d => state.heads[d.date] = d);
    state.days = idx.days.map(d => d.date).sort().reverse();
  }catch(e){
    $("#main").innerHTML = `<p class="err">${esc(T.indexErr)}</p>`;
    return;
  }
  $("#date").innerHTML = state.days.map(d => `<option value="${d}">${d}</option>`).join("");
  $("#archive").innerHTML = state.days.slice(0,14).map(d => `<li><button data-d="${d}"><span class="d">${d}</span><span class="h">${esc(pick(state.heads[d], "headline"))}</span></button></li>`).join("");
  $("#archive").onclick = e => { const b = e.target.closest("button[data-d]"); if(b) load(b.dataset.d); };
  let want = null; try{ want = new URLSearchParams(location.search).get("d"); }catch(e){}
  await load(state.days.includes(want) ? want : state.days[0]);
}

async function load(date){
  state.date = date; state.country = null; state.cat = null;
  $("#date").value = date;
  const i = state.days.indexOf(date);
  $("#prev").disabled = i >= state.days.length - 1;
  $("#next").disabled = i <= 0;
  document.querySelectorAll("#archive button").forEach(b => b.setAttribute("aria-current", b.dataset.d === date));
  try{ history.replaceState(null, "", "?d=" + date); }catch(e){}
  try{ state.data = await getJSON(`data/${date}.json`); }
  catch(e){ $("#main").innerHTML = `<p class="err">${esc(T.err(date))}</p>`; return; }
  render();
  window.scrollTo(0,0);
}

function counts(list){ const c = {}; CAT_ORDER.forEach(k => c[k] = 0); list.forEach(a => c[a.category] = (c[a.category]||0) + 1); return c; }

function filtered(){
  const d = state.data, q = state.q.trim().toLowerCase();
  const ids = state.country ? new Set((d.countries_pulse.find(p => p.country === state.country)||{}).article_ids||[]) : null;
  const cross = state.country || q;   // 국가·검색 필터는 해외·국내를 가로질러 찾는다
  return d.articles.filter(a =>
    (cross || regionOf(a) === state.region) &&
    (!state.cat || a.category === state.cat) &&
    (!state.imp || a.importance >= 2) &&
    (!ids || ids.has(a.id) || a.countries.includes(state.country)) &&
    (!q || [a.title,a.title_ko,a.title_en,a.summary_ko,a.summary_en,a.sales_note,a.sales_note_en,a.source,a.countries.map(cname).join(" "),a.countries.join(" ")].join(" ").toLowerCase().includes(q))
  );
}

function card(a){
  return `<article class="it cat-${esc(a.category)}" id="${esc(a.id)}">
    <div class="meta">
      ${(state.country || state.q.trim()) ? `<span class="rg">${REG[regionOf(a)]}</span>` : ""}
      <span class="stars" title="${T.impTitle(a.importance)}">${"★".repeat(a.importance)}${"☆".repeat(3-a.importance)}</span>
      <span class="flags">${a.countries.map(c => `<span>${esc(cname(c))}</span>`).join("")}</span>
      ${a.language && a.language !== "en" ? `<span class="lang">${esc(T.origLang(LANG[a.language] || a.language))}</span>` : ""}
      <span class="src">${esc(a.source)} · ${esc(a.published)}</span>
    </div>
    <h3><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(pick(a,"title"))}</a></h3>
    <p class="orig">${esc(a.title)}</p>
    <p class="sum">${esc(pick(a,"summary"))}</p>
    ${pick(a,"sales_note") ? `<div class="note"><b>${T.salesNote}</b>${esc(pick(a,"sales_note"))}</div>` : ""}
    ${a.related && a.related.length ? `<p class="rel">${T.related} ${a.related.map((u,i) => `<a href="${esc(u)}" target="_blank" rel="noopener">[${i+1}]</a>`).join(" ")}</p>` : ""}
  </article>`;
}

function render(){
  const d = state.data, dom = state.region === "domestic";
  const all = d.articles.filter(a => regionOf(a) === state.region), c = counts(all), total = all.length || 1;
  const rc = {overseas:0, domestic:0}; d.articles.forEach(a => rc[regionOf(a)]++);
  const list = filtered(), fc = counts(list);
  const active = state.cat || state.country || state.imp || state.q.trim();
  const showPulse = !dom || state.country;

  // side: category filter + toc
  $("#catnav").innerHTML = CAT_ORDER.map(k => `<button class="cat-${k}" data-k="${k}" aria-pressed="${state.cat===k}"><span class="dot"></span>${CAT[k]}<span class="n">${c[k]}</span></button>`).join("");
  $("#toc").innerHTML = [["top", T.summary(REG[state.region])],["key",T.keyTitle],...(showPulse ? [["pulse",T.pulseTitle]] : []),...CAT_ORDER.filter(k => fc[k]).map(k => ["sec-"+k, CAT[k]])]
    .map(([id,l]) => `<button data-go="${id}">${l}</button>`).join("");

  const ovText = dom ? (pick(d,"domestic_overview") || T.noDomestic) : pick(d,"overview");
  const overview = ovText.split(LANGCODE === "en" ? "Sales angle:" : "영업 관점:");
  const key = all.filter(a => a.importance === 3);
  const pulseRows = d.countries_pulse.map(p => {
    const n = new Set([...(p.article_ids||[]), ...all.filter(a => a.countries.includes(p.country)).map(a => a.id)]).size;
    return `<tr data-c="${esc(p.country)}" aria-selected="${state.country===p.country}" tabindex="0">
      <td class="cn">${esc(LANGCODE === "en" ? (p.name_en || cname(p.country)) : p.name_ko)}</td>
      <td class="st"><span class="stance st-${esc(p.stance)}">${STANCE[p.stance]||esc(p.stance)}</span></td>
      <td class="sg">${esc(LANGCODE === "en" ? (p.signal_en || p.signal) : p.signal)}</td>
      <td class="ct">${T.nArticles(n)}</td></tr>`;
  }).join("");

  const filterLabel = [state.cat && CAT[state.cat], state.country && cname(state.country), state.imp && T.impOnly, state.q.trim() && `"${state.q.trim()}"`].filter(Boolean).join(" · ");

  $("#main").innerHTML = `
    <section class="headline" id="top">
      <h1>${fmtDate(d.date)} ${T.briefing}</h1>
      <p class="sub">${esc(T.collected(d.period.from, d.period.to))} · ${esc(T.counts(rc.overseas, rc.domestic))}</p>
    </section>

    <div class="regions" role="tablist">${Object.keys(REG).map(r => `<button role="tab" data-r="${r}" aria-selected="${state.region===r}">${REG[r]}<span class="n">${rc[r]}</span></button>`).join("")}</div>

    <section>
      <p class="sub" style="margin:0;font:500 12.5px var(--mono);color:var(--muted)">${esc(T.regionStats(REG[state.region], all.length, key.length, dom ? null : d.countries_pulse.length))}</p>
      <div class="dist" aria-hidden="true">${CAT_ORDER.map(k => c[k] ? `<span class="cat-${k}" style="width:${c[k]/total*100}%"></span>` : "").join("")}</div>
      <div class="legend">${CAT_ORDER.map(k => `<span class="cat-${k}"><i></i>${CAT[k]}<b>${c[k]}</b></span>`).join("")}</div>
    </section>

    ${active ? "" : `
    <section class="card summary">
      <div class="sec-h"><h2>${T.summary(REG[state.region])}</h2></div>
      <p>${esc(overview[0].trim())}</p>
      ${overview[1] ? `<div class="sales"><b>${T.salesAngle}</b><p>${esc(overview[1].trim())}</p></div>` : ""}
    </section>

    ${key.length ? `<section id="key">
      <div class="sec-h"><h2>${T.keyTitle}</h2><span class="n">${T.keyCount(key.length)}</span><span class="hint">${T.keyHint}</span></div>
      <ul class="keylist card">${key.map(a => `<li class="cat-${esc(a.category)}"><a href="#${esc(a.id)}"><span class="tag">${CAT[a.category]}</span><span class="t">${esc(pick(a,"title"))}</span><span class="s">${esc(pick(a,"sales_note") || pick(a,"summary"))}</span></a></li>`).join("")}</ul>
    </section>` : ""}`}

    ${showPulse ? `<section id="pulse">
      <div class="sec-h"><h2>${T.pulseTitle}</h2><span class="n">${T.pulseCount(d.countries_pulse.length)}</span><span class="hint">${T.pulseHint}</span></div>
      <div class="card tbl-wrap"><table class="pulse">
        <thead><tr><th>국가</th><th>기조</th><th>오늘의 신호</th><th style="text-align:right">기사</th></tr></thead>
        <tbody>${pulseRows}</tbody></table></div>
    </section>` : ""}

    ${active ? `<div class="filterbar"><span>${T.filterLabel(esc(filterLabel), list.length)}</span><button id="clear">${T.clear}</button></div>` : ""}

    ${list.length ? CAT_ORDER.filter(k => fc[k]).map(k => `
      <section class="catsec cat-${k}" id="sec-${k}">
        <div class="sec-h"><h2>${CAT[k]}</h2><span class="n">${T.nArticles(fc[k])}</span></div>
        <div class="items">${list.filter(a => a.category === k).sort((x,y) => y.importance - x.importance || y.published.localeCompare(x.published)).map(card).join("")}</div>
      </section>`).join("") : '<p class="empty">조건에 맞는 기사가 없습니다.</p>'}
  `;

  document.querySelectorAll(".pulse tbody tr").forEach(tr => {
    const pick = () => { state.country = state.country === tr.dataset.c ? null : tr.dataset.c; render(); document.getElementById("pulse").scrollIntoView(); };
    tr.onclick = pick;
    tr.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(); } };
  });
  document.querySelectorAll(".regions button").forEach(b => b.onclick = () => {
    state.region = b.dataset.r; state.cat = null; state.country = null;
    try{ localStorage.setItem("nnd-region", state.region); }catch(e){}
    render();
  });
  const clr = $("#clear"); if(clr) clr.onclick = () => { state.cat = null; state.country = null; state.imp = false; state.q = ""; $("#q").value = ""; $("#imp").checked = false; render(); };
}

$("#catnav").onclick = e => { const b = e.target.closest("button[data-k]"); if(!b) return; state.cat = state.cat === b.dataset.k ? null : b.dataset.k; render(); };
$("#toc").onclick = e => { const b = e.target.closest("button[data-go]"); if(!b) return; const el = document.getElementById(b.dataset.go); if(el) el.scrollIntoView(); };
$("#imp").onchange = e => { state.imp = e.target.checked; render(); };
let qt; $("#q").oninput = e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value; render(); }, 180); };
$("#langbtn").onclick = () => setLang(LANGCODE === "ko" ? "en" : "ko");
$("#date").onchange = e => load(e.target.value);
$("#prev").onclick = () => load(state.days[state.days.indexOf(state.date) + 1]);
$("#next").onclick = () => load(state.days[state.days.indexOf(state.date) - 1]);
boot();
</script>
</body>
</html>
